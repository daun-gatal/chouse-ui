name: CLI

# PR validation for the Go CLI. Release publishing lives in auto-release.yml
# (same version, same vX tags, same approval gates as the app) — this
# workflow only proves the tree builds, tests green, and packages cleanly.
on:
  pull_request:
    branches:
      - preview
    paths:
      - cli/**
      - changelogs/cli/**
      - scripts/build-cli.sh
      - scripts/install-cli.sh
      - scripts/release-cli.ts
      - .github/workflows/cli.yml
      - .github/workflows/cli-release.yml
      - .github/workflows/ci.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go Vet & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: cli/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Build smoke
        run: |
          go build -o /tmp/chouse ./cmd/chouse
          /tmp/chouse --help | head -n 20
          /tmp/chouse query --help | head -n 10

  package:
    name: Package Snapshot
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: cli/go.sum

      # Same script the release uses — proves all five platforms compile and
      # the archives + checksums verify, without publishing anything.
      - name: Snapshot archives
        run: |
          ./scripts/build-cli.sh "0.0.0-snapshot"
          (cd cli/dist && sha256sum -c checksums.txt --status)
          test "$(ls cli/dist/chouse-cli_* | wc -l)" = "5"

      - name: Installer lint
        run: |
          shellcheck scripts/install-cli.sh scripts/build-cli.sh \
            || echo "shellcheck not available, skipping"

  installer-smoke:
    name: Installer Smoke
    runs-on: ${{ matrix.os }}
    needs: test
    permissions:
      contents: read
    strategy:
      # macOS runners have no sha256sum (shasum only); pinning SHELL per OS
      # covers both the zsh and bash rc-wiring paths deterministically.
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            test_shell: /bin/bash
          - os: macos-latest
            test_shell: /bin/zsh
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build and exercise binary offline
        run: |
          cd cli
          go build -o /tmp/chouse ./cmd/chouse
          /tmp/chouse version --output json || true
          /tmp/chouse --help | grep -q "Safe-by-default"

      # Sandboxed HOME so the PATH-wiring assertions never touch the runner's
      # real rc files. Installs the latest cli-v* prebuilt release.
      - name: Installer PATH wiring
        env:
          TEST_SHELL: ${{ matrix.test_shell }}
          # Authenticated API quota (5000/hr) for `latest` cli-v* resolution;
          # shared runner egress IPs exhaust the 60/hr anonymous quota.
          GH_TOKEN: ${{ github.token }}
        run: |
          SANDBOX="$(mktemp -d)"
          export HOME="$SANDBOX/home"
          mkdir -p "$HOME"
          export SHELL="$TEST_SHELL"
          export INSTALL_DIR="$HOME/.local/bin"
          sh scripts/install-cli.sh
          test -x "$INSTALL_DIR/chouse"
          "$INSTALL_DIR/chouse" version --output json || true
          # Second run must not duplicate the marker (idempotency).
          # Mirror the installer's shell detection to know which rc files
          # should carry the marker.
          sh scripts/install-cli.sh >/dev/null 2>&1
          SHELL_NAME="$(basename "${SHELL:-sh}")"
          case "$SHELL_NAME" in
            fish) FILES="$HOME/.config/fish/config.fish" ;;
            zsh) FILES="$HOME/.zshrc" ;;
            bash)
              if [ -e "$HOME/.bash_profile" ]; then FILES="$HOME/.bashrc $HOME/.bash_profile";
              else FILES="$HOME/.bashrc $HOME/.profile"; fi ;;
            *) FILES="$HOME/.profile" ;;
          esac
          for f in $FILES; do
            test "$(grep -cF '# chouse CLI (added by install-cli.sh)' "$f")" = "1"
          done
          # Every appended sh-syntax line must actually put chouse on PATH.
          # (Sandbox HOME means these files contain only our block.)
          for f in $FILES; do
            case "$f" in
              *.fish) continue ;;
              *) env -i HOME="$HOME" PATH="/usr/bin:/bin" bash -c 'source "$0" && command -v chouse' "$f" | grep -q "chouse" ;;
            esac
          done
          # Opt-out must leave rc files alone.
          SANDBOX2="$(mktemp -d)"
          HOME="$SANDBOX2/home" INSTALL_DIR="$SANDBOX2/home/.local/bin" CHOUSE_NO_MODIFY_PATH=1 sh scripts/install-cli.sh >/dev/null 2>&1
          test ! -e "$SANDBOX2/home/.bashrc"
          test ! -e "$SANDBOX2/home/.zshrc"
          test ! -e "$SANDBOX2/home/.profile"
          # Injected PATH (containers/IDEs): DEST on PATH but missing from
          # shell init — rc files must still be wired for fresh shells.
          SANDBOX3="$(mktemp -d)"
          mkdir -p "$SANDBOX3/home"
          HOME="$SANDBOX3/home" INSTALL_DIR="$SANDBOX3/home/.local/bin" PATH="$SANDBOX3/home/.local/bin:$PATH" SHELL="$TEST_SHELL" sh scripts/install-cli.sh >/dev/null 2>&1
          case "$(basename "$TEST_SHELL")" in
            zsh) F3="$SANDBOX3/home/.zshrc" ;;
            *) F3="$SANDBOX3/home/.bashrc" ;;
          esac
          grep -qF '# chouse CLI (added by install-cli.sh)' "$F3"
          rm -rf "$SANDBOX" "$SANDBOX2" "$SANDBOX3"
