name: Renovate

# Keeps dependencies and the digest-pinned base images current so the image
# scan gate in ci.yml (and ArtifactHub's report) stays green. Runs from the
# default branch only.
on:
  schedule:
    # Daily at 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      log_level:
        description: "Renovate log level."
        type: choice
        options: [debug, info, warn]
        default: info

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A PAT is recommended via the RENOVATE_TOKEN secret: PRs opened with the
      # default GITHUB_TOKEN do not trigger the CI workflows they need to pass.
      - name: Run Renovate
        uses: renovatebot/github-action@v46.2.6
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
