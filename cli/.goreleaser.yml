# GoReleaser for the chouse CLI. Run from the repo root:
#   goreleaser release --config cli/.goreleaser.yml
# Snapshots (PRs): goreleaser release --snapshot --clean --config cli/.goreleaser.yml
version: 2

project_name: chouse-cli

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: chouse
    dir: cli
    main: ./cmd/chouse
    binary: chouse
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    builds:
      - chouse
    name_template: "chouse-cli_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

sbom:
  artifacts: archive

signs:
  - id: cosign-archives
    cmd: cosign
    stdin: "{{ .Env.COSIGN_PASSWORD }}"
    args:
      - sign-blob
      - "--yes"
      - "--output-signature={{ .Signature }}"
      - "--output-certificate={{ .Certificate }}"
      - "{{ .Artifact }}"
    artifacts: archive
    output: true

release:
  github:
    owner: daun-gatal
    name: chouse-ui
  name_template: "chouse {{.Version}}"
  prerelease: auto
  draft: false
  # CLI ships on cli-v* tags only; app v* tags never trigger this config.
  # -pre tags are skipped (match image/chart -pre semantics).
