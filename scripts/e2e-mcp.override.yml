# DinD E2E override for docker-compose.local.yml (used by scripts/e2e-mcp.sh).
#
# Same rationale as scripts/e2e-pat.override.yml: under DinD the base file's
# ./.config.yaml bind mount resolves on the DOCKER HOST — where this tree does
# not exist — so all host bind mounts are dropped and the server boots from
# environment + defaults. MCP needs no env: it is served at /mcp on the web
# port and the checker turns it on through the Agents › MCP API (ADR 0017).
services:
  chouse-ui:
    volumes: !reset
      - chouse-ui-local-data:/app/data
    environment:
      CHOUSE_CONFIG_PATH: ""
      # Passed through from the shell (scripts/e2e-mcp.sh exports test-only
      # defaults); the production image refuses to boot without them.
      RBAC_ENCRYPTION_KEY: ${RBAC_ENCRYPTION_KEY}
      RBAC_ENCRYPTION_SALT: ${RBAC_ENCRYPTION_SALT}
