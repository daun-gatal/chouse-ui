# Accepted-risk vulnerability exceptions for the Grype source scan
# (Security Scan job in .github/workflows/ci.yml: `grype dir:. --fail-on high`).
# Mirrors .trivyignore, which holds the full rationale. See SECURITY.md,
# "Known accepted vulnerabilities".
#
# Grype has no expiry field. Review each entry on the same date as its
# .trivyignore expiry and remove it as soon as the fix lands.
ignore:
  # braces 3.0.3 - High - stack-exhaustion DoS via deeply nested brace patterns.
  # No patched release exists upstream. Only reachable through the AI agent's
  # model-generated glob patterns.
  - vulnerability: GHSA-vfj7-8cjw-p6xm
    package:
      name: braces
      type: npm
  - vulnerability: CVE-2026-93687
    package:
      name: braces
      type: npm
  # minimatch 3.1.4 - Medium - DoS via globparts amplification. The only fix
  # (11.0.1) breaks eslint's CommonJS callers. Dev-only lint dependency, not in
  # the production image; patterns come from our own eslint.config.js.
  - vulnerability: GHSA-g3hv-75wg-m249
    package:
      name: minimatch
      type: npm
  - vulnerability: CVE-2026-118764
    package:
      name: minimatch
      type: npm
