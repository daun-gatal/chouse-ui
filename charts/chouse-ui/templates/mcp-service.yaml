{{- if .Values.mcp.enabled }}
{{/*
Dedicated MCP Service (ADR 0013): targets the `mcp` container port only, so
NetworkPolicy can scope agent traffic separately from the public origin and
MCP is unreachable at the network layer when disabled.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chouse-ui.fullname" . }}-mcp
  labels:
    {{- include "chouse-ui.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  type: ClusterIP
  ports:
    - name: mcp
      port: {{ .Values.mcp.service.port }}
      targetPort: mcp
      protocol: TCP
  selector:
    {{- include "chouse-ui.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
{{- end }}
