{{- include "chouse-ui.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chouse-ui.fullname" . }}
  labels:
    {{- include "chouse-ui.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- if eq .Values.database.type "sqlite" }}
  # Two pods must never share the SQLite file, even transiently mid-rollout.
  strategy:
    type: Recreate
  {{- else }}
  strategy:
    type: RollingUpdate
  {{- end }}
  selector:
    matchLabels:
      {{- include "chouse-ui.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "chouse-ui.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config-secret.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "chouse-ui.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if or .Values.postgresql.enabled .Values.initContainers }}
      initContainers:
        {{- if .Values.postgresql.enabled }}
        # The bundled database starts alongside the app, so without this the
        # first connection attempt races it — the app recovers, but logs a
        # scary ECONNREFUSED warning and can't auto-create a missing database.
        - name: wait-for-postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          command:
            - sh
            - -ec
            - |
              until pg_isready -h {{ include "chouse-ui.fullname" . }}-postgresql -p 5432 -U {{ .Values.postgresql.auth.username | quote }}; do
                echo "waiting for postgresql..."
                sleep 2
              done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
        {{- end }}
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: chouse-ui
          image: {{ include "chouse-ui.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- if .Values.preStopSleepSeconds }}
          # Endpoint removal propagates to kube-proxy asynchronously; keep
          # accepting connections briefly so in-flight DNAT to this pod
          # doesn't blackhole during rolling updates.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .Values.preStopSleepSeconds }}"]
          {{- end }}
          ports:
            - name: http
              containerPort: 5521
              protocol: TCP
            {{- if .Values.mcp.enabled }}
            - name: mcp
              containerPort: 8752
              protocol: TCP
            {{- end }}
          env:
            {{- include "chouse-ui.env" . | nindent 12 }}
            {{- if .Values.dedicatedScheduler.enabled }}
            - name: SCHEDULED_QUERIES_ENABLED
              value: "false"
            {{- else }}
            - name: SCHEDULED_QUERIES_ENABLED
              value: {{ .Values.scheduledQueries.enabled | quote }}
            {{- end }}
            {{- if .Values.mcp.enabled }}
            # MCP endpoint (ADR 0013): dedicated port, PAT-only auth. The host
            # is 0.0.0.0 so the Service can reach it; exposure is controlled
            # by the Service/NetworkPolicy, not the listener.
            - name: MCP_ENABLED
              value: "true"
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "8752"
            - name: MCP_ALLOW_WRITES
              value: {{ .Values.mcp.allowWrites | quote }}
            - name: MCP_ALLOW_DESTRUCTIVE
              value: {{ .Values.mcp.allowDestructive | quote }}
            - name: MCP_TOOLSETS
              value: {{ join "," .Values.mcp.toolsets | quote }}
            {{- with .Values.mcp.allowedOrigins }}
            - name: MCP_ALLOWED_ORIGINS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if .Values.mcp.timeoutSeconds }}
            - name: MCP_TIMEOUT_SECONDS
              value: {{ .Values.mcp.timeoutSeconds | quote }}
            {{- end }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.probes.startup | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if eq .Values.database.type "sqlite" }}
            - name: data
              mountPath: /app/data
            {{- end }}
            {{- if .Values.config }}
            - name: config
              mountPath: {{ include "chouse-ui.configMountPath" . }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if eq .Values.database.type "sqlite" }}
        - name: data
          {{- if .Values.database.sqlite.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.database.sqlite.persistence.existingClaim | default (printf "%s-data" (include "chouse-ui.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- if .Values.config }}
        - name: config
          secret:
            secretName: {{ include "chouse-ui.fullname" . }}-config
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
