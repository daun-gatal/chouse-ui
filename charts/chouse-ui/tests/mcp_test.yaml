suite: MCP served on the web port (ADR 0017)
templates:
  - deployment.yaml
  - networkpolicy.yaml
  - NOTES.txt
  # referenced by checksum annotations — loaded, not asserted
  - config-secret.yaml
  - secret.yaml
tests:
  - it: exposes only the web port, which also serves /mcp
    template: deployment.yaml
    set:
      secrets.existingSecret: s
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].ports
          count: 1
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 5521

  - it: ignores legacy mcp.* values (no port, no MCP_* env)
    template: deployment.yaml
    set:
      secrets.existingSecret: s
      mcp.enabled: true
      mcp.allowWrites: true
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].ports
          count: 1
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: MCP_ENABLED
          any: true

  - it: admits only the web port through the NetworkPolicy
    template: networkpolicy.yaml
    set:
      secrets.existingSecret: s
      networkPolicy.enabled: true
      mcp.enabled: true
    asserts:
      - equal:
          path: spec.ingress[0].ports
          value:
            - port: 5521
              protocol: TCP

  - it: points at Agents › MCP in the install notes
    template: NOTES.txt
    set:
      secrets.existingSecret: s
    asserts:
      - matchRegexRaw:
          pattern: "served at /mcp on the same Service and Ingress"
      - notMatchRegexRaw:
          pattern: "no longer used"

  - it: warns when legacy mcp.* values are still set
    template: NOTES.txt
    set:
      secrets.existingSecret: s
      mcp.enabled: true
    asserts:
      - matchRegexRaw:
          pattern: "`mcp\\.\\*` values are no longer used"
