suite: MCP endpoint
templates:
  - deployment.yaml
  - mcp-service.yaml
  - mcp-ingress.yaml
  - networkpolicy.yaml
  # referenced by checksum annotations — loaded, not asserted
  - config-secret.yaml
  - secret.yaml
tests:
  - it: renders nothing MCP-specific by default
    set:
      secrets.existingSecret: s
    asserts:
      - hasDocuments:
          count: 0
        template: mcp-service.yaml

  - it: web deployment has no MCP env or port by default
    template: deployment.yaml
    set:
      secrets.existingSecret: s
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: MCP_ENABLED
      - notContains:
          path: spec.template.spec.containers[0].ports
          content:
            name: mcp

  - it: wires the MCP listener, env, and dedicated Service when enabled
    template: deployment.yaml
    set:
      secrets.existingSecret: s
      mcp.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MCP_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MCP_HOST
            value: "0.0.0.0"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MCP_TOOLSETS
            value: "core,explore,query,observe,ops"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MCP_ALLOW_WRITES
            value: "false"
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: mcp
            containerPort: 8752
            protocol: TCP

  - it: exposes the mcp Service on the configured port
    template: mcp-service.yaml
    set:
      secrets.existingSecret: s
      mcp.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.ports[0].port
          value: 8752
      - equal:
          path: spec.ports[0].targetPort
          value: mcp
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: mcp

  - it: allows the MCP port through the NetworkPolicy when both are enabled
    template: networkpolicy.yaml
    set:
      secrets.existingSecret: s
      networkPolicy.enabled: true
      mcp.enabled: true
    asserts:
      - contains:
          path: spec.ingress[0].ports
          content:
            port: 8752
            protocol: TCP

  - it: keeps the MCP port out of the NetworkPolicy when MCP is disabled
    template: networkpolicy.yaml
    set:
      secrets.existingSecret: s
      networkPolicy.enabled: true
    asserts:
      - notContains:
          path: spec.ingress[0].ports
          content:
            port: 8752

  - it: honors the configured service port and type
    template: mcp-service.yaml
    set:
      secrets.existingSecret: s
      mcp.enabled: true
      mcp.service.port: 9443
      mcp.service.type: NodePort
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 9443
      - equal:
          path: spec.type
          value: NodePort

  - it: renders service annotations verbatim
    template: mcp-service.yaml
    set:
      secrets.existingSecret: s
      mcp.enabled: true
      mcp.service.annotations:
        example.com/agent-traffic: "mcp"
    asserts:
      - equal:
          path: metadata.annotations["example.com/agent-traffic"]
          value: mcp

  - it: renders no service annotations when unset
    template: mcp-service.yaml
    set:
      secrets.existingSecret: s
      mcp.enabled: true
    asserts:
      - notExists:
          path: metadata.annotations

  - it: fails to render when writes are enabled without the MCP listener
    template: deployment.yaml
    set:
      secrets.existingSecret: s
      mcp.allowWrites: true
    asserts:
      - failedTemplate:
          errorMessage: "mcp.allowWrites=true requires mcp.enabled=true"

  - it: fails to render when destructive is enabled without writes
    template: deployment.yaml
    set:
      secrets.existingSecret: s
      mcp.enabled: true
      mcp.allowDestructive: true
    asserts:
      - failedTemplate:
          errorMessage: "mcp.allowDestructive=true requires mcp.allowWrites=true (the server refuses this combination at startup too)"

  - it: fails to render when config.mcp conflicts with chart-managed env
    template: deployment.yaml
    set:
      secrets.existingSecret: s
      config:
        mcp:
          enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "config.mcp conflicts with chart-managed settings — remove it from `config` and use the chart values instead (config.yaml overrides the pod environment)"

  - it: renders custom origins and timeout
    template: deployment.yaml
    set:
      secrets.existingSecret: s
      mcp.enabled: true
      mcp.allowedOrigins:
        - https://agents.example
      mcp.timeoutSeconds: 120
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MCP_ALLOWED_ORIGINS
            value: "https://agents.example"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MCP_TIMEOUT_SECONDS
            value: "120"

  - it: renders the MCP ingress verbatim for the declared host
    template: mcp-ingress.yaml
    set:
      secrets.existingSecret: s
      mcp.enabled: true
      mcp.ingress.enabled: true
      mcp.ingress.hosts:
        - host: chouse.example.com
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.rules[0].host
          value: chouse.example.com
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /mcp
      - equal:
          path: spec.rules[0].http.paths[0].pathType
          value: Prefix
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: RELEASE-NAME-chouse-ui-mcp
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.name
          value: mcp

  - it: renders every declared host with the fixed /mcp path
    template: mcp-ingress.yaml
    set:
      secrets.existingSecret: s
      mcp.enabled: true
      mcp.ingress.enabled: true
      mcp.ingress.hosts:
        - host: chouse.example.com
        - host: mcp.example.com
    asserts:
      - equal:
          path: spec.rules[0].host
          value: chouse.example.com
      - equal:
          path: spec.rules[1].host
          value: mcp.example.com
      - equal:
          path: spec.rules[1].http.paths[0].path
          value: /mcp

  - it: renders className, annotations, and tls verbatim
    template: mcp-ingress.yaml
    set:
      secrets.existingSecret: s
      mcp.enabled: true
      mcp.ingress.enabled: true
      mcp.ingress.hosts:
        - host: mcp.example.com
      mcp.ingress.className: nginx-mcp
      mcp.ingress.annotations:
        nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
        nginx.ingress.kubernetes.io/proxy-buffering: "off"
      mcp.ingress.tls:
        - hosts:
            - mcp.example.com
          secretName: mcp-tls
    asserts:
      - equal:
          path: spec.ingressClassName
          value: nginx-mcp
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/proxy-read-timeout"]
          value: "300"
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/proxy-buffering"]
          value: "off"
      - equal:
          path: spec.tls[0].secretName
          value: mcp-tls

  - it: renders no annotations or className when unset
    template: mcp-ingress.yaml
    set:
      secrets.existingSecret: s
      # Deliberately also set the UI's className/annotations to prove no
      # inheritance happens (strict verbatim rendering).
      ingress.className: nginx
      ingress.annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "10m"
      mcp.enabled: true
      mcp.ingress.enabled: true
      mcp.ingress.hosts:
        - host: chouse.example.com
    asserts:
      - notExists:
          path: spec.ingressClassName
      - notExists:
          path: metadata.annotations
      - notExists:
          path: spec.tls

  - it: renders nothing by default
    template: mcp-ingress.yaml
    set:
      secrets.existingSecret: s
    asserts:
      - hasDocuments:
          count: 0

  - it: fails to render when the MCP listener is disabled
    template: deployment.yaml
    set:
      secrets.existingSecret: s
      mcp.ingress.enabled: true
      mcp.ingress.hosts:
        - host: chouse.example.com
    asserts:
      - failedTemplate:
          errorMessage: "mcp.ingress.enabled=true requires mcp.enabled=true (the /mcp path targets the dedicated MCP Service and would 503 without it)"

  - it: fails to render without any declared host
    template: deployment.yaml
    set:
      secrets.existingSecret: s
      mcp.enabled: true
      mcp.ingress.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "mcp.ingress.enabled=true requires at least one mcp.ingress.hosts entry (declare the hosts that carry /mcp)"
