apiVersion: v2
name: chouse-ui
description: >-
  A modern web interface for ClickHouse with built-in RBAC, fleet monitoring,
  scheduled queries, data health checks, and an AI SRE.
type: application
# Chart version — bump manually in every PR that changes the chart
# (see .rules/HELM_CHART.md). Breaking values changes bump major.
version: 2.0.0
# App version — owned by auto-release.yml; never edit by hand.
appVersion: "3.14.0"
kubeVersion: ">=1.25.0-0"
home: https://github.com/daun-gatal/chouse-ui
# Rendered as the package logo on artifacthub.io and by other chart UIs.
# Must be a direct image URL — a github.com/.../blob/... link serves the HTML
# file-viewer page, not the image. Kept in the repo (not the project domain)
# so the logo doesn't depend on the site staying up; if `main` is renamed or
# public/logo.png moves, update this.
icon: https://raw.githubusercontent.com/daun-gatal/chouse-ui/main/public/logo.png
sources:
  - https://github.com/daun-gatal/chouse-ui
keywords:
  - clickhouse
  - database
  - sql
  - rbac
  - monitoring
  - ai
maintainers:
  - name: daun-gatal
    url: https://github.com/daun-gatal
# Rendered by artifacthub.io on the package page. Update `changes` in every
# chart PR (it is shown per version); the `images` entry is kept in sync with
# appVersion automatically by auto-release.yml.
annotations:
  artifacthub.io/category: database
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Chart documentation
      url: https://github.com/daun-gatal/chouse-ui/blob/main/charts/chouse-ui/README.md
    - name: App repository
      url: https://github.com/daun-gatal/chouse-ui
    - name: Design (ADR 0008)
      url: https://github.com/daun-gatal/chouse-ui/blob/main/docs/adr/0008-helm-chart-and-oci-distribution.md
    - name: Multi-replica correctness (ADR 0010)
      url: https://github.com/daun-gatal/chouse-ui/blob/main/docs/adr/0010-pod-local-state-and-multi-replica-correctness.md
  artifacthub.io/images: |
    - name: chouse-ui
      image: ghcr.io/daun-gatal/chouse-ui:v3.14.0
  artifacthub.io/changes: |
    - kind: added
      description: Data Observability Platform settings (ADR 0016) — optional `observability.*` (fleet interval, retention, query shapes, scratch database), `remediation.*` (maintenance window, Slack approval channel), `publicBaseUrl`, and `slack.*` with existing-secret support
    - kind: deprecated
      description: "`FLEET_POLLER_ENABLED` / `config.fleet.poller_enabled` are accepted but ignored: fleet collection is always on"
    - kind: removed
      description: "Breaking: `mcp.*` values, the dedicated MCP port (8752), the `<release>-mcp` Service and the MCP Ingress. MCP is now served at `/mcp` on the web port through the existing Service and Ingress, and turned on in Agents › MCP (ADR 0017). Leftover `mcp:` values are ignored with a warning in the install notes"
