apiVersion: v2
name: chouse-ui
description: >-
  A modern web interface for ClickHouse with built-in RBAC, fleet monitoring,
  scheduled queries, data health checks, and an AI SRE.
type: application
# Chart version — bump manually in every PR that changes the chart
# (see .rules/HELM_CHART.md). Breaking values changes bump major.
version: 1.1.1
# App version — owned by auto-release.yml; never edit by hand.
appVersion: "3.11.0"
kubeVersion: ">=1.25.0-0"
home: https://github.com/daun-gatal/chouse-ui
# Rendered as the package logo on artifacthub.io and by other chart UIs.
# Must be an absolute URL — served from the project site (GitHub Pages), which
# is the canonical brand URL and survives repository restructuring.
icon: https://chouse-ui.com/logo.png
sources:
  - https://github.com/daun-gatal/chouse-ui
keywords:
  - clickhouse
  - database
  - sql
  - rbac
  - monitoring
  - ai
maintainers:
  - name: daun-gatal
    url: https://github.com/daun-gatal
# Rendered by artifacthub.io on the package page. Update `changes` in every
# chart PR (it is shown per version); the `images` entry is kept in sync with
# appVersion automatically by auto-release.yml.
annotations:
  artifacthub.io/category: database
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Chart documentation
      url: https://github.com/daun-gatal/chouse-ui/blob/main/charts/chouse-ui/README.md
    - name: App repository
      url: https://github.com/daun-gatal/chouse-ui
    - name: Design (ADR 0008)
      url: https://github.com/daun-gatal/chouse-ui/blob/main/docs/adr/0008-helm-chart-and-oci-distribution.md
  artifacthub.io/images: |
    - name: chouse-ui
      image: ghcr.io/daun-gatal/chouse-ui:v3.11.0
  artifacthub.io/changes: |
    - kind: added
      description: Chart logo shown on artifacthub.io and other chart UIs
