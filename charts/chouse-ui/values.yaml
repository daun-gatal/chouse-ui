# Default values for chouse-ui.
#
# The app itself is configured through the freeform `config:` block (rendered
# to a config.yaml the server loads via CHOUSE_CONFIG_PATH). Only values that
# shape the Kubernetes deployment are first-class here.

# -- Number of web pods. Must be 1 when `database.type` is `sqlite` (the chart
# refuses to render otherwise). When >1, the chart sets `CHOUSE_HA=true` on the
# pods automatically.
replicaCount: 1

image:
  # -- Container image repository.
  repository: ghcr.io/daun-gatal/chouse-ui
  # -- Image tag. Defaults to `v<Chart.appVersion>`.
  tag: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Secrets for pulling the image from a private registry.
imagePullSecrets: []

# -- Override the chart name.
nameOverride: ""
# -- Override the fully qualified release name.
fullnameOverride: ""

database:
  # -- RBAC database backend: `sqlite` (single replica + PVC) or `postgres`
  # (external PostgreSQL; required for HA / more than one replica).
  type: sqlite

  sqlite:
    persistence:
      # -- Persist the SQLite database (`/app/data`) on a PVC. Disabling this
      # loses all users, connections, and settings on every pod restart —
      # only do it for throwaway installs.
      enabled: true
      # -- PVC size.
      size: 1Gi
      # -- StorageClass. Empty string uses the cluster default.
      storageClass: ""
      # -- Use a pre-created PVC instead of chart-managed one.
      existingClaim: ""
      # -- PVC access modes.
      accessModes:
        - ReadWriteOnce
      # -- Extra annotations for the PVC (e.g. to keep it on helm uninstall).
      annotations: {}

  postgres:
    # -- Full PostgreSQL connection URL
    # (`postgres://user:pass@host:5432/dbname`). Stored in a chart-managed
    # Secret. Prefer `existingSecret` so the URL never lands in values files.
    url: ""
    # -- Name of an existing Secret holding the connection URL.
    existingSecret: ""
    # -- Key inside `existingSecret` that holds the URL.
    existingSecretKey: RBAC_POSTGRES_URL
    # -- Connection pool size per pod.
    poolSize: 10

# Bundled PostgreSQL — EVALUATION AND CI ONLY.
# A single pod with no backups, no failover, and no upgrade path. Production
# installs should point `database.postgres` at a managed PostgreSQL or an
# operator (CloudNativePG). See ADR 0009.
postgresql:
  # -- Deploy a PostgreSQL StatefulSet alongside the app and wire
  # `RBAC_POSTGRES_URL` to it. Requires `database.type: postgres`, and
  # conflicts with `database.postgres.url`/`existingSecret`.
  enabled: false
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    # -- Database name, user, and password. The password is **required** when
    # enabled — the chart never invents credentials. `openssl rand -hex 16`.
    database: chouse
    username: chouse
    password: ""
  persistence:
    # -- Off by default: an evaluation database that loses its data on restart
    # is honest about what it is. Turn it on for a longer-lived demo.
    enabled: false
    size: 8Gi
    storageClass: ""
  # -- Pod security context. Defaults suit the official postgres image
  # (runs as uid/gid 70 on Alpine).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  # -- Node selector for the database pod.
  nodeSelector: {}
  # -- Tolerations for the database pod.
  tolerations: []

# Bundled ClickHouse — EVALUATION AND CI ONLY.
# A single node with no replication, no backups, and no tuning. Production
# installs should use the Altinity or ClickHouse operator and point CHouse UI
# at it. See ADR 0009.
clickhouse:
  # -- Deploy a single-node ClickHouse StatefulSet and pre-fill the app's
  # connection form with its in-cluster URL.
  enabled: false
  image:
    repository: clickhouse/clickhouse-server
    tag: "25.3-alpine"
    pullPolicy: IfNotPresent
  auth:
    # -- ClickHouse user and password. The password is **required** when
    # enabled. `openssl rand -hex 16`.
    username: default
    password: ""
    # -- Grant the user access management rights (needed for CHouse UI's
    # ClickHouse user/role management features).
    accessManagement: true
  persistence:
    # -- Off by default, same reasoning as the bundled PostgreSQL.
    enabled: false
    size: 10Gi
    storageClass: ""
  # -- Pod security context. Defaults suit the official ClickHouse image
  # (runs as uid/gid 101).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  # -- Node selector for the ClickHouse pod.
  nodeSelector: {}
  # -- Tolerations for the ClickHouse pod.
  tolerations: []

secrets:
  # -- Name of an existing Secret with keys `JWT_SECRET`,
  # `RBAC_ENCRYPTION_KEY`, and `RBAC_ENCRYPTION_SALT` (recommended). When
  # empty, the three inline values below are required and rendered into a
  # chart-managed Secret. The chart never auto-generates these: the encryption
  # key/salt protect stored ClickHouse passwords, and a regenerated key makes
  # them unrecoverable.
  existingSecret: ""
  # -- JWT signing secret, min 32 chars. Generate: `openssl rand -base64 32`.
  jwtSecret: ""
  # -- AES-256 key for stored connection passwords, 64 hex chars.
  # Generate: `openssl rand -hex 32`.
  encryptionKey: ""
  # -- Key-derivation salt, exactly 64 hex chars. Generate: `openssl rand -hex 32`.
  encryptionSalt: ""

# -- Freeform CHouse UI configuration, rendered to a Secret-mounted
# `config.yaml` (see `.config.example.yaml` in the repo for the full schema:
# SSO, fleet poller, AI doctor, admin seeding, CORS, log level, ...). Do NOT
# set keys the chart already manages (`port`, `node_env`, `static_path`,
# `rbac.db_type`, `rbac.sqlite_path`, `rbac.postgres_url`, `rbac.encryption`,
# `jwt.secret`, `scheduled_queries`) — the chart refuses to render if you do,
# because config.yaml values override the pod environment.
config: {}

# -- Extra environment variables for the web pods (list of EnvVar). Useful for
# referencing SSO client secrets from Secrets via `valueFrom`.
extraEnv: []

# -- Extra `envFrom` sources (ConfigMap/Secret refs) for the web pods.
extraEnvFrom: []

scheduledQueries:
  # -- Run the in-process scheduled-queries scheduler on the web pods.
  # Redundant ticks across pods are harmless (per-job atomic lease on
  # PostgreSQL). Ignored (forced off on web pods) when
  # `dedicatedScheduler.enabled` is true.
  enabled: true

dedicatedScheduler:
  # -- Run the scheduled-queries scheduler on a dedicated single-replica
  # Deployment instead of the web pods. Requires `database.type: postgres`.
  enabled: false
  # -- Resources for the scheduler pod.
  resources: {}

mcp:
  # -- Serve the MCP (Model Context Protocol) endpoint on a dedicated port
  # (8752) so AI agents can operate CHouse UI safely without the browser
  # (ADR 0013). Authentication is PAT-only (`Authorization: Bearer ch_pat_…`,
  # minted once in the UI); requests are verified live against RBAC on every
  # call, exactly like the UI and CLI. Disabled by default: no Service, no
  # port, unreachable.
  enabled: false
  # -- Allow the write-gated toolset (create/run/ack actions). This is a
  # server-side policy — agents cannot opt in; read-only is the default.
  allowWrites: false
  # -- Enable destructive tools (KILL, raw SQL, deletes). Requires
  # `allowWrites`, and every invocation additionally requires in-host human
  # approval (MCP elicitation).
  allowDestructive: false
  # -- Toolsets to register. Default: reads only. `writes`/`destructive`
  # additionally require the flags above; `ai` spends LLM budget.
  toolsets: [core, explore, query, observe, ops]
  # -- Origins allowed on the MCP endpoint. Empty rejects any request that
  # carries an Origin header (DNS-rebinding protection); headerless clients
  # (CLI agents, curl) always pass. Browser-embedded MCP hosts must be
  # listed here explicitly.
  allowedOrigins: []
  # -- Per-request tool timeout in seconds (1..600).
  timeoutSeconds: 60
  service:
    # -- Service type for the dedicated MCP Service (`<release>-mcp`).
    # `LoadBalancer`/`NodePort` expose MCP directly without an Ingress.
    type: ClusterIP
    # -- Service port (targets the fixed container port 8752).
    port: 8752
    # -- Extra annotations for the MCP Service.
    annotations: {}
  ingress:
    # -- Expose MCP at `https://<host>/mcp` through the ingress. Rendered as
    # its own Ingress, mirroring the UI ingress: `className`, `annotations`,
    # and `tls` are rendered verbatim — no inheritance, no merging. Requires
    # `mcp.enabled` and at least one host. TLS-terminating controllers
    # (e.g. Tailscale Funnel) need no `tls`.
    enabled: false
    # -- Hosts carrying the `/mcp` path (same shape as `ingress.hosts` minus
    # `paths` — the path is fixed at `/mcp`).
    hosts: []
    # -- Rendered verbatim, exactly like `ingress.className`.
    className: ""
    # -- Rendered verbatim, exactly like `ingress.annotations`. For SSE:
    #   nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    #   nginx.ingress.kubernetes.io/proxy-buffering: "off"
    annotations: {}
    # -- Rendered verbatim, exactly like `ingress.tls`.
    tls: []

service:
  # -- Service type.
  type: ClusterIP
  # -- Service port (targets the fixed container port 5521).
  port: 80
  # -- Extra annotations for the Service.
  annotations: {}
  # -- Service `sessionAffinity` (`ClientIP` or `None`). Since ADR 0010 the app
  # keeps no request-authoritative state in pod memory, so multi-replica is
  # correct WITHOUT stickiness and you should not need this. It remains
  # available for operators who want a client pinned to one pod for other
  # reasons (e.g. warm per-pod caches). Note that behind an ingress controller
  # or mesh proxy every request appears to come from the proxy's IP, which
  # collapses `ClientIP` affinity onto a single pod — prefer cookie affinity at
  # your ingress if you need stickiness.
  sessionAffinity: ""
  # -- Session stickiness timeout when `sessionAffinity: ClientIP`.
  sessionAffinityTimeoutSeconds: 10800

ingress:
  # -- Expose the UI through an Ingress.
  enabled: false
  # -- IngressClass name.
  className: ""
  # -- Ingress annotations. Two matter operationally: AI chat streams over
  # SSE, so raise the proxy read timeout (nginx:
  # `nginx.ingress.kubernetes.io/proxy-read-timeout: "300"`) and disable
  # buffering (`nginx.ingress.kubernetes.io/proxy-buffering: "off"`); and
  # login rate limiting keys on X-Forwarded-For, so the ingress must
  # overwrite it with the real client IP.
  annotations: {}
  hosts:
    - host: chouse-ui.local
      paths:
        - path: /
          pathType: Prefix
  # -- TLS configuration.
  tls: []

networkPolicy:
  # -- Create a NetworkPolicy for the pods.
  enabled: false
  # -- Extra `from` peers allowed to reach the pods on the app port (in
  # addition to same-namespace pods). Use this to admit your ingress
  # controller's namespace.
  ingressFrom: []
  # -- Restrict egress. When true, only DNS plus `egressTo` are allowed —
  # list your ClickHouse hosts, PostgreSQL, IdP, SMTP, and AI provider
  # endpoints there. When false, all egress is allowed.
  restrictEgress: false
  # -- Extra egress rules (full NetworkPolicyEgressRule objects) applied when
  # `restrictEgress` is true.
  egressTo: []

serviceAccount:
  # -- Create a ServiceAccount for the pods.
  create: true
  # -- Annotations for the ServiceAccount.
  annotations: {}
  # -- ServiceAccount name override.
  name: ""

# -- Extra annotations for the pods.
podAnnotations: {}
# -- Extra labels for the pods.
podLabels: {}
# -- Labels added to every rendered resource.
commonLabels: {}

# -- Pod security context. The image runs as uid/gid 1001; `fsGroup` makes the
# SQLite PVC writable.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

# -- Container security context. The root filesystem is read-only; the chart
# mounts an emptyDir on `/tmp`.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 1Gi

probes:
  # -- Liveness probe — dependency-free endpoint.
  liveness:
    httpGet:
      path: /api/health
      port: http
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  # -- Readiness probe — 503 until the RBAC database is healthy and
  # migrations have applied.
  readiness:
    httpGet:
      path: /api/rbac/health
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  # -- Startup probe — generous budget (5 min) so long upgrade migrations
  # don't get the pod killed.
  startup:
    httpGet:
      path: /api/rbac/health
      port: http
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 60

# -- Grace period so the SIGTERM handler can release poller leases and drain
# scheduled-query slots.
terminationGracePeriodSeconds: 60

# -- Seconds the web container keeps serving after Kubernetes starts
# terminating it (preStop sleep). Endpoint removal reaches kube-proxy
# asynchronously; without this, connections routed to a terminating pod
# during a rolling update can hang. Set to 0 to disable. Applies to web pods
# only (the scheduler receives no Service traffic).
preStopSleepSeconds: 5

autoscaling:
  # -- Horizontal pod autoscaling for the web pods. Requires
  # `database.type: postgres` (render fails on sqlite). Implies
  # `CHOUSE_HA=true` regardless of `replicaCount`.
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  # -- Target average CPU utilization (percent).
  targetCPUUtilizationPercentage: 80
  # -- Target average memory utilization (percent). Empty disables the
  # memory metric.
  targetMemoryUtilizationPercentage: ""

pdb:
  # -- PodDisruptionBudget for the web pods. Only meaningful with more than
  # one replica.
  enabled: false
  # -- Minimum pods that must stay available. Mutually exclusive with
  # `maxUnavailable`.
  minAvailable: 1
  # -- Maximum pods that may be unavailable. Set `minAvailable` to "" when
  # using this.
  maxUnavailable: ""

# -- Topology spread constraints for the web pods (postgres/HA installs).
topologySpreadConstraints: []

# -- Node selector for all pods.
nodeSelector: {}
# -- Tolerations for all pods.
tolerations: []
# -- Affinity for all pods.
affinity: {}
# -- Priority class for all pods.
priorityClassName: ""

# -- Extra init containers for the web pods.
initContainers: []
# -- Extra volumes for the web pods.
extraVolumes: []
# -- Extra volume mounts for the web container.
extraVolumeMounts: []
